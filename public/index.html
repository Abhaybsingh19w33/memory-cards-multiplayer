<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Memory Cards — Online Multiplayer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================= LOBBY SCREEN ================= -->
  <div id="lobbyScreen" class="screen">
    <div class="setup">
      <h1>Memory Cards</h1>
      <p class="sub">Play with friends on separate devices. Everyone enters the same room code.</p>
      
      <div class="field">
        <div class="label">Your Name</div>
        <input type="text" id="nameInput" maxlength="16" placeholder="Your name" autocomplete="nickname">
      </div>

      <div class="field">
        <div class="label">Room Code</div>
        <input type="text" id="roomInput" maxlength="12" placeholder="e.g. FRIDAY" style="text-transform:uppercase" autocomplete="off">
      </div>

      <button class="primary" id="joinBtn" style="width:100%" onclick="joinRoom()">Join / Create Room</button>

      <div id="lobbyPlayers" class="row" style="margin-top:18px"></div>

      <div class="field" id="cppField" style="display:none">
        <div class="label">Cards per player</div>
        <input type="number" id="cppInput" min="3" max="10" value="5" onchange="setCardsPerPlayer(this.value)">
      </div>

      <button class="gold hidden" id="startBtn" style="width:100%;margin-top:10px" onclick="SocketClient.emit('startGame')">Start Game</button>
    </div>
  </div>

  <!-- ================= GAME TABLE SCREEN ================= -->
  <div id="gameScreen" class="table hidden">
    <div class="topbar">
      <button class="secondary" id="topbarNewGameBtn" onclick="UI.confirmNewGame()">New Game</button>
      <div id="turnBadge" class="badge">Turn</div>
      <div id="statusBadge" class="badge hidden"></div>
    </div>

    <!-- Opponent and table players -->
    <div id="players" class="players"></div>

    <!-- Center table: Draw deck and Discard pile -->
    <div class="center">
      <div class="pileWrap">
        <div id="drawPile" class="pile draw" onclick="SocketClient.emit('draw')">DRAW<br>DECK</div>
        <div class="pileLabel">Tap to pick</div>
      </div>
      <div class="pileWrap">
        <div id="discardPile" class="pile discard">—</div>
        <div class="pileLabel">Discard pile</div>
      </div>
    </div>

    <!-- Local player's hand and controls -->
    <div class="handPanel">
      <div id="handArea" class="handArea">
        <div class="handTitle">
          <b id="handTitle">Your cards</b>
          <span id="selectedInfo" class="sub" style="margin:0"></span>
        </div>

        <div id="hand" class="hand"></div>
      </div>

      <!-- Control buttons: Separated into Gameplay and Reveal groups to prevent DOM destruction -->
      <div id="controlsContainer" class="controls-container">
        <!-- Active Gameplay Controls -->
        <div id="gameplayControls" class="controls">
          <button class="secondary" id="arrangeBtn" onclick="UI.openArrange()">Arrange</button>
          <button class="secondary" id="discardSelBtn" onclick="UI.submitMatch()">Discard selected</button>
          <button class="gold" id="callBtn" onclick="SocketClient.emit('callReveal')">Call / Reveal</button>
          <button class="primary" id="nextBtn" onclick="SocketClient.emit('next')">Next ▶</button>
        </div>

        <!-- Endgame Reveal Controls -->
        <div id="revealControls" class="controls hidden">
          <button class="gold" id="showRankingBtn" style="width:100%" onclick="UI.showRanking()">Next — Show Ranking ▶</button>
        </div>
      </div>

      <div id="hint" class="hint"></div>
      <div id="logBox" class="log"></div>
    </div>
  </div>

  <!-- ================= POPUP MODAL ================= -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div id="modalBox" class="modalBox"></div>
  </div>

  <!-- ================= NOTIFICATION BANNER ================= -->
  <div id="noticeBanner" class="noticeBanner hidden" role="status"></div>

  <!-- ================= ERROR BANNER ================= -->
  <div id="errBanner" class="errBanner hidden" role="alert"></div>

  <!-- ================= SCRIPTS ================= -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/socketClient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
